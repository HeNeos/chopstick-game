<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chopsticks Game</title>
    <style>
        /* --- Basic Setup --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f4f7f9;
            color: #333;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }

        /* --- Game Container --- */
        #game-board {
            width: 90%;
            max-width: 700px;
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        #game-status {
            font-size: 0.8rem;
            font-weight: bold;
            color: #3498db;
            margin: 1rem 0;
            min-height: 2.5rem;
            transition: color 0.3s;
        }

        /* --- Player Areas --- */
        .player-area {
            border: 3px solid #ddd;
            padding: 1rem;
            margin: 1.5rem 0;
            border-radius: 10px;
            min-height: 180px;
            transition: all 0.3s ease-in-out;
        }

        .player-area.active {
            border-color: #3498db;
            box-shadow: 0 0 15px rgba(52, 152, 219, 0.5);
            transform: scale(1.02);
        }

        .player-area h2 {
            margin-top: 0;
            color: #7f8c8d;
        }

        .hands-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            min-height: 120px;
            flex-wrap: wrap;
        }

        .hand {
            width: 120px;
            height: 140px;
            position: relative;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .hand:hover {
            transform: translateY(-5px);
        }

        .hand.non-interactive {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .hand-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hand-sprite {
          width: 128px;
          height: 128px;
          background-image: url("assets/hands.png");
          background-repeat: no-repeat;
          background-size: 640px 640px;
          image-rendering: pixelated;
          transform-origin: center;
          transition: transform 0.2s ease;
        }

        .hand.selected {
          transform: scale(1.1);
          filter: drop-shadow(0 0 5px yellow);
        }

        .palm {
            fill: #ffebcd;
            stroke: #34495e;
            stroke-width: 2;
        }

        .finger {
            fill: #ffebcd;
            stroke: #34495e;
            stroke-width: 4; 
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
            transform-origin: center bottom;
            opacity: 1;
            transition: transform 0.4s ease, opacity 0.3s ease;
        }

        .finger.folded {
            transform: translateY(30px) scaleY(0.5);
            opacity: 0.5;
            stroke: #c9b09a;
            fill: #c9b09a;
        }

        .hand-fingers-text { /* Optional text for debugging/clarity */
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            font-weight: bold;
            color: #34495e;
            z-index: 2;
        }

        /* --- Buttons --- */
        #controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .action-button {
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            background-color: #2ecc71;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            z-index: 3;
            position: relative;
        }
        
        .action-button:hover {
            background-color: #27ae60;
        }
        
        #restart-btn {
            background-color: #95a5a6;
        }
        #restart-btn:hover {
            background-color: #7f8c8d;
        }
        #mode-switch-btn {
            background-color: #3498db;
        }
        #mode-switch-btn:hover {
            background-color: #2980b9;
        }

        .hand .action-button {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
            background-color: #f39c12;
        }
        .hand .action-button:hover {
            background-color: #e67e22;
        }

    </style>
</head>
<body>

    <div id="game-board">
        <h1>Chopsticks Game</h1>
        
        <div id="game-status">Loading...</div>

        <div class="player-area" id="player2-area">
            <h2 id="player2-name">Opponent</h2>
            <div class="hands-container" id="player2-hands"></div>
        </div>

        <div class="player-area" id="player1-area">
            <h2 id="player1-name">You</h2>
            <div class="hands-container" id="player1-hands"></div>
        </div>

        <div id="controls">
            <button id="restart-btn" class="action-button">Restart Game</button>
            <button id="mode-switch-btn" class="action-button">Play vs Human</button>
            <button id="difficulty-btn" class="action-button">Difficulty: Medium</button>
        </div>
    </div>

    <script type="module">
        import markov from "./markov.json" with { type: "json" };;
        document.addEventListener('DOMContentLoaded', () => {

            const statusDisplay = document.getElementById('game-status');
            const player1HandsContainer = document.getElementById('player1-hands');
            const player2HandsContainer = document.getElementById('player2-hands');
            const player1Area = document.getElementById('player1-area');
            const player2Area = document.getElementById('player2-area');
            const player1Name = document.getElementById('player1-name');
            const player2Name = document.getElementById('player2-name');
            const restartBtn = document.getElementById('restart-btn');
            const modeSwitchBtn = document.getElementById('mode-switch-btn');
            const difficultyBtn = document.getElementById('difficulty-btn');
            difficultyBtn.addEventListener('click', () => {
                const levels = ['easy', 'medium', 'hard'];
                let currentIndex = levels.indexOf(gameState.difficulty);
                gameState.difficulty = levels[(currentIndex + 1) % levels.length];
                difficultyBtn.textContent = `Difficulty: ${gameState.difficulty.charAt(0).toUpperCase() + gameState.difficulty.slice(1)}`;
            });

            function encodeState(cHands, hHands, turn) {
                let computerHands = cHands.slice();
                let humanHands = hHands.slice();
                let value = 0;
                if(computerHands.length === 2 && computerHands[0] < computerHands[1]){
                    computerHands[0] += computerHands[1];
                    computerHands[1] = computerHands[0] - computerHands[1];
                    computerHands[0] = computerHands[0] - computerHands[1];
                }
                for(let i=0; i<computerHands.length; i++){
                    value *= 10;
                    value += computerHands[i];
                }
                if(computerHands.length === 1) value *= 10;
                if(humanHands.length === 2 && humanHands[0] < humanHands[1]){
                    humanHands[0] += humanHands[1];
                    humanHands[1] = humanHands[0] - humanHands[1];
                    humanHands[0] = humanHands[0] - humanHands[1];
                }
                for(let i=0; i<humanHands.length; i++){
                    value *= 10;
                    value += humanHands[i];
                }
                if(humanHands.length === 1) value *= 10;
                value *= 10;
                if(turn === "player1") value += 1;
                else value += 2
                return value;
            }

            let gameState = {};

            function initializeGame() {
                if (gameState.gameMode === undefined) {
                    gameState.gameMode = 'pvc'; // 'pvc' (Player vs Computer) or 'pvp' (Player vs Player)
                }
                if (gameState.difficulty === undefined) {
                    gameState.difficulty = 'medium'; // 'easy', 'medium', or 'hard'
                }

                gameState.players = {
                    player1: { name: 'Player 1', hands: [1, 1] },
                    player2: { name: 'Player 2', hands: [1, 1] }
                };
                
                // Set player names based on game mode
                if (gameState.gameMode === 'pvc') {
                    gameState.players.player1.name = 'You';
                    gameState.players.player2.name = 'Computer';
                    modeSwitchBtn.textContent = 'Play vs Human';
                } else {
                    gameState.players.player1.name = 'Player 1';
                    gameState.players.player2.name = 'Player 2';
                    modeSwitchBtn.textContent = 'Play vs Computer';
                }

                gameState.currentPlayerKey = 'player1';
                gameState.selectedHand = null;
                gameState.gameOver = false;
                gameState.message = `${gameState.players.player1.name}'s Turn! Select one of your hands.`;
                updateDisplay();
            }

            // --- Core Game Logic ---
            function performAttack(attackerKey, attackingHandIndex, defenderKey, defendingHandIndex) {
                const attacker = gameState.players[attackerKey];
                const defender = gameState.players[defenderKey];
                const attackValue = attacker.hands[attackingHandIndex];

                const totalFingers = defender.hands[defendingHandIndex] + attackValue;
                defender.hands[defendingHandIndex] = totalFingers % 5;
                
                // Filter out defeated hands (value is 0)
                attacker.hands = attacker.hands.filter(hand => hand > 0);
                defender.hands = defender.hands.filter(hand => hand > 0);

                switchTurn();
            }

            function performSplit(playerKey, handIndex) {
                const player = gameState.players[playerKey];
                const fingersToSplit = player.hands[handIndex];
                if (fingersToSplit % 2 === 0 && player.hands.length === 1 && fingersToSplit > 0) {
                    const newHandValue = fingersToSplit / 2;
                    player.hands = [newHandValue, newHandValue];
                    switchTurn();
                } else {
                    console.warn("Invalid split attempt.");
                    gameState.message = "Invalid split. You can only split a single even hand.";
                    updateDisplay();
                }
            }

            function bestMovement(stateEncoded, computerHands, humanHands){
                let markovNode = markov[stateEncoded];
                if(markovNode === undefined){
                    console.log("Unknown state");
                    console.log(stateEncoded, computerHands, humanHands);
                    return false;
                }
                let nextStates = markovNode["edges"];
                if(nextStates.length === 0){
                    console.log("No edges?");
                    console.log(stateEncoded, computerHands, humanHands);
                    return false;
                }
                let bestIndex = -1;
                let difficulty = gameState.difficulty || 'medium';
                let skillFactor;

                switch (difficulty) {
                    case 'easy':
                        skillFactor = 1 - 0.5;  // 50% chance of optimal move
                        break;
                    case 'medium':
                        skillFactor = 1 - 0.75;  // 75% chance of optimal move
                        break;
                    case 'hard':
                        skillFactor = 1 - 0.875;  // 87.5% chance of optimal move
                        break;
                }
                for(let i=0; i<nextStates.length; i++){
                    let randomValue = Math.random();
                    if(randomValue > skillFactor) {bestIndex = i; break;}
                    else skillFactor /= 1.5;
                }
                if(bestIndex === -1) bestIndex = 0;
                nextStates.sort(function(a, b) {return b["probability"]-a["probability"];});
                const nextComputerHands = nextStates[bestIndex]["node"][0];
                const nextHumanHands = nextStates[bestIndex]["node"][1];

                const humanPlayer = gameState.players["player1"];
                const computerPlayer = gameState.players["player2"];

                // Human keeps its state, then computer splitted
                if(computerHands.length === 1 && nextComputerHands[0] === nextComputerHands[1] && computerHands[0] == 2*nextComputerHands[0]){
                    performSplit("player2", 0);
                    return true;
                }
                
                for(let i=0; i<computerHands.length; i++){
                    for(let j=0; j<humanHands.length; j++){
                        let nextHand = (computerHands[i] + humanHands[j])%5;
                        if(humanHands.length === 1){
                            if(nextHand === nextHumanHands[0]){
                                performAttack("player2", i, "player1", 0);
                                return true;
                            }
                        }
                        else{
                            let anotherHand = humanHands[1-j];
                            const minHand = anotherHand < nextHand ? anotherHand : nextHand;
                            const maxHand = anotherHand > nextHand ? anotherHand : nextHand;
                            if(minHand === nextHumanHands[1] && maxHand === nextHumanHands[0]){
                                performAttack("player2", i, "player1", j);
                                return true;
                            }
                        }
                    }
                } 

                return false;
            }

            function switchTurn() {
                gameState.selectedHand = null;
                if (checkGameOver()) return;
                
                gameState.currentPlayerKey = (gameState.currentPlayerKey === 'player1') ? 'player2' : 'player1';
                const currentPlayerName = gameState.players[gameState.currentPlayerKey].name;
                
                if (gameState.gameMode === 'pvc' && gameState.currentPlayerKey === 'player2') {
                    gameState.message = `${currentPlayerName}'s Turn...`;
                    updateDisplay();
                    setTimeout(computerMove, 1000);
                } else {
                    gameState.message = `${currentPlayerName}'s Turn! Select a hand.`;
                    updateDisplay();
                }
            }

            function checkGameOver() {
                const p1 = gameState.players.player1;
                const p2 = gameState.players.player2;

                if (p1.hands.length === 0) {
                    gameState.gameOver = true;
                    gameState.message = `${p2.name} Wins! 🎉`;
                } else if (p2.hands.length === 0) {
                    gameState.gameOver = true;
                    gameState.message = `${p1.name} Wins! 🎉`;
                }
                
                if (gameState.gameOver) updateDisplay();
                return gameState.gameOver;
            }

            // --- Computer AI ---
            function computerMove() {
                if (gameState.gameOver) return;
                const computer = gameState.players.player2;
                const human = gameState.players.player1;

                if (computer.hands.length === 0 || human.hands.length === 0) {
                    switchTurn();
                    return;
                }

                let stateEncoded = encodeState(computer.hands, human.hands, "player2");

                // TODO: always performs best movement
                const performedMovement = bestMovement(stateEncoded, computer.hands, human.hands);
                if(performedMovement) return;


                 // Initial movement
                if (computer.hands.length === 2 && human.hands.length === 2 && human.hands[0] === 1 && human.hands[1] === 1) {
                    if(computer.hands[0] === 1 && computer.hands[1] === 2){
                        performAttack('player2', 0, 'player1', 0);
                        return;
                    }
                    if(computer.hands[0] === 2 && computer.hands[1] === 1){
                        performAttack('player2', 1, 'player1', 0);
                        return;
                    }
                    
                }

                if (computer.hands.length === 1 && human.hands.length === 1 && computer.hands[0] + human.hands[0] === 5) {
                    performAttack('player2', 0, 'player1', 0);
                    return;
                }

                // AI Logic: Prioritize splitting if possible and beneficial, otherwise attack
                const canSplit = computer.hands.length === 1 && computer.hands[0] > 0 && computer.hands[0] % 2 === 0;

                if (canSplit) {
                    performSplit('player2', 0);
                    return;
                }
                
                // If no good split or not possible, then attack
                
                // try to kill a hand
                for(let computerHandIndex=0; computerHandIndex<computer.hands.length; computerHandIndex++){
                    const computerHands = computer.hands[computerHandIndex];
                    for(let humanHandIndex=0; humanHandIndex<human.hands.length; humanHandIndex++){
                        if(computerHands + human.hands[humanHandIndex] === 5){
                            console.log("smart attack")
                            performAttack('player2', computerHandIndex, 'player1', humanHandIndex);
                            return;
                        }
                    }
                }
  
                if(computer.hands.length === 1 && human.hands.length > 1 && human.hands[0] !== human.hands[1]){
                    const firstIsCandidate = (2*computer.hands[0] + human.hands[0])%5 !== 0;
                    const secondIsCandidate = (2*computer.hands[0] + human.hands[1])%5 !== 0;
                    if (firstIsCandidate && secondIsCandidate){
                        // TODO: case to improve
                        performAttack('player2', 0, 'player1', 0);
                    }
                    else if(firstIsCandidate){
                        performAttack('player2', 0, 'player1', 0);
                    }
                    else if(secondIsCandidate){
                        performAttack('player2', 0, 'player1', 1);
                    }
                    else {
                        // TODO: case to improve
                        performAttack('player2', 0, 'player1', 0);
                    }
                    return;
                }


                // if not good attack, random
                const computerHandIndex = Math.floor(Math.random() * computer.hands.length);
                const humanHandIndex = Math.floor(Math.random() * human.hands.length);
                performAttack('player2', computerHandIndex, 'player1', humanHandIndex);
            }

            // --- UI and Display Logic ---

            function createHandElement(ownerKey, index, value) {
                const handDiv = document.createElement('div');
                handDiv.classList.add('hand');

                const isLeft = (ownerKey === 'player1' && index === 0) || (ownerKey === 'player2' && index === 1);
                if (isLeft) handDiv.classList.add('left');

                const colorRow = ownerKey === 'player1' ? 2 : 3;

                const frameWidth = 128;
                const frameHeight = 128;

                const bgX = (-value + 1) * frameWidth;
                const bgY = -colorRow * frameHeight;

                const handSprite = document.createElement('div');
                handSprite.classList.add('hand-sprite');
                handSprite.style.backgroundPosition = `${bgX}px ${bgY}px`;

                handDiv.appendChild(handSprite);

                const isComputerTurn = gameState.gameMode === 'pvc' && gameState.currentPlayerKey === 'player2';
                if (!gameState.gameOver && !isComputerTurn) {
                    handDiv.onclick = () => handleHandClick(ownerKey, index);
                } else {
                    handDiv.classList.add('non-interactive');
                }

                if (gameState.selectedHand && gameState.selectedHand.ownerKey === ownerKey && gameState.selectedHand.index === index) {
                    handDiv.classList.add('selected');
                }

                const player = gameState.players[ownerKey];
                const canSplit = player.hands.length === 1 && value > 0 && value % 2 === 0;

                if (ownerKey === gameState.currentPlayerKey && canSplit) {
                    const splitBtn = document.createElement('button');
                    splitBtn.textContent = 'Split';
                    splitBtn.classList.add('action-button');
                    splitBtn.onclick = (e) => {
                        e.stopPropagation();
                        performSplit(ownerKey, index);
                    };
                    handDiv.appendChild(splitBtn);
                }

                return handDiv;
            }
            
            function updateDisplay() {
                statusDisplay.textContent = gameState.message;
                
                player1HandsContainer.innerHTML = '';
                player2HandsContainer.innerHTML = '';
                
                player1Name.textContent = gameState.players.player1.name;
                player2Name.textContent = gameState.players.player2.name;

                player1Area.classList.toggle('active', gameState.currentPlayerKey === 'player1' && !gameState.gameOver);
                player2Area.classList.toggle('active', gameState.currentPlayerKey === 'player2' && !gameState.gameOver);

                gameState.players.player1.hands.forEach((val, i) => {
                    player1HandsContainer.appendChild(createHandElement('player1', i, val));
                });
                gameState.players.player2.hands.forEach((val, i) => {
                    player2HandsContainer.appendChild(createHandElement('player2', i, val));
                });
            }

            function handleHandClick(ownerKey, index) {
                if (gameState.currentPlayerKey === 'player2' && gameState.gameMode === 'pvc') return;
                if (gameState.gameOver) return;

                if (ownerKey === gameState.currentPlayerKey) {
                    gameState.selectedHand = { ownerKey, index };
                    gameState.message = `Selected hand with ${gameState.players[ownerKey].hands[index]} fingers. Now, select an opponent's hand to attack.`;
                } 
                else if (gameState.selectedHand && gameState.selectedHand.ownerKey === gameState.currentPlayerKey) {
                    performAttack(
                        gameState.selectedHand.ownerKey, 
                        gameState.selectedHand.index, 
                        ownerKey,
                        index
                    );
                } else {
                    gameState.message = "Please select one of your own hands first.";
                }
                updateDisplay();
            }

            function switchGameMode() {
                gameState.gameMode = (gameState.gameMode === 'pvc') ? 'pvp' : 'pvc';
                initializeGame();
            }

            restartBtn.addEventListener('click', initializeGame);
            modeSwitchBtn.addEventListener('click', switchGameMode);

            initializeGame();
        });
    </script>
</body>
</html>
